<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>প্রাসের গতি — ইন্টারঅ্যাকটিভ সিমুলেশন</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<style>
:root{--bg:#dcebfa;--card:#fff;--ink:#0b2a4f;--mut:#5b7089;--navy:#06305f;--blue:#0a63d6;--line:#b7d3f0;--ok:#0f8a4b;--okbg:#e6f7ee;--unk:#b86a00;--unkbg:#fff4df;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:#041f40}#wrap{position:relative;overflow:hidden}
body{font-family:'Hind Siliguri','Noto Sans Bengali','Kalpurush','Vrinda',sans-serif;color:var(--ink)}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
header{height:76px;align-items:center;flex:none;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 24px;gap:16px}
header h1{margin:0;font-size:30px;font-weight:700;white-space:nowrap}
.tools{display:flex;gap:8px;align-items:center}
.tools button,.tools select{background:#ffffff22;color:#fff;border:1px solid #ffffff66;border-radius:8px;padding:5px 12px;font:inherit;font-size:16px;cursor:pointer}

/* layout */
#main{flex:1;min-height:0;display:grid;grid-template-columns:520px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"inp view" "res view";gap:10px 14px;padding:10px 16px}
#inp{grid-area:inp}.stage{grid-area:view}#res{grid-area:res;overflow-y:auto;min-height:0;display:flex;flex-direction:column;gap:8px;padding-right:2px}
/* compact cards */
#top{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:7px;padding:2px 6px 4px;box-shadow:0 1px 3px #06305f18}
.card.k{border-color:var(--blue)}.card.c{border-color:var(--ok);background:var(--okbg)}.card.u{border:1.5px dashed var(--unk);background:var(--unkbg)}

.card.x{opacity:.55;background:#eef1f5;border:2px dashed #9aa8ba}.card.x input{color:var(--mut)}
.top{font-weight:600;font-size:13px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;margin-top:1px;border:1.5px solid var(--line);border-radius:6px;background:#fff;overflow:hidden;height:26px}
.row input{flex:1;min-width:0;border:0;padding:0 6px;font:inherit;font-size:16px;font-weight:600;color:var(--blue);outline:0;background:transparent}
.card.c input{color:var(--ok)}.row input.bad{background:#fde8e8}
.row select{width:52px;border:0;border-left:1.5px solid var(--line);background:#eef5fd;font:inherit;font-size:12px;padding:0;color:var(--mut)}
.seg{display:flex;gap:2px;margin-top:2px}.seg button{flex:1;border:1px solid var(--line);background:#fff;border-radius:4px;font:inherit;font-size:11.5px;line-height:1.3;padding:0;cursor:pointer;color:var(--mut)}.seg button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.tag{font-size:11px;color:var(--mut);margin-top:2px;min-height:16px;display:flex;align-items:center}.tag:empty{display:none}
#bt{display:flex;gap:6px;margin-top:5px}
.btn{border:0;border-radius:10px;font:inherit;font-weight:700;cursor:pointer;color:#fff;background:var(--blue)}
#show{flex:1.2;height:32px;font-size:15px}#solve{flex:1;height:32px;font-size:13px;background:var(--navy)}
#msg{margin-top:6px;font-size:15px}#msg:empty{display:none}
.warn,.info{border-radius:8px;padding:6px 10px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.warn{background:#fde8e8;color:#9b1c1c;border:1px solid #f3b4b4}.info{background:var(--unkbg);border:1px solid var(--unk)}
.info button{padding:3px 10px;font-size:15px;border-radius:6px}
/* viewport */
.stage{display:flex;flex-direction:column;min-height:0;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#fff}
#view{position:relative;flex:1;min-height:0;background:#cfe5f5}
#view canvas{position:absolute;inset:0;width:100%;height:100%}
#vbar{position:absolute;left:10px;top:10px;display:flex;gap:6px;z-index:2}
#vbar button{background:#06305fe0;color:#fff;border:0;border-radius:8px;padding:6px 12px;font:inherit;font-size:16px;cursor:pointer}#vbar .on{background:var(--blue)}
#hud{position:absolute;right:10px;top:10px;z-index:2;background:#06305fd0;color:#fff;border-radius:8px;padding:6px 12px;font-size:16px;line-height:1.45;pointer-events:none}#hud:empty{display:none}
#ph{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;color:#06305f;font-size:26px;z-index:1}
.ctl{flex:none;padding:8px 12px;display:flex;gap:8px;align-items:center;background:#fff}
.ctl button{background:var(--navy);color:#fff;border:0;border-radius:8px;padding:6px 12px;font:inherit;font-size:16px;cursor:pointer;white-space:nowrap}
.ctl input{flex:1;min-width:80px;accent-color:var(--blue)}.ctl span{font-size:16px;color:var(--mut);white-space:nowrap}
/* result panels */
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 12px 8px;box-shadow:0 2px 6px #06305f14;flex:none}
.panel h2{margin:0 0 3px;font-size:18px;color:var(--navy)}
.fold h2{cursor:pointer;user-select:none;display:flex;align-items:center;justify-content:space-between;margin:0}.fold h2::after{content:"▾";font-size:16px;transition:transform .2s}.fold.shut h2::after{transform:rotate(90deg)}.fold:not(.shut) h2{margin-bottom:3px}.fold.shut table{display:none}
table{width:100%;border-collapse:collapse}td,th{padding:3px 3px;border-bottom:1px solid var(--line);text-align:left;font-size:16px}
td:nth-child(2),th:nth-child(2),td:nth-child(3),th:nth-child(3){text-align:right}td.u{color:var(--mut)}td:nth-child(3){color:var(--mut);width:56px}
tr.sub td{background:#eef5fd;font-weight:600;color:var(--navy);text-align:left!important}
footer{height:34px;flex:none;background:var(--navy);color:#fff;display:flex;align-items:center;padding:0 24px;font-size:15px;white-space:nowrap;overflow:hidden}
/* portrait / phone */
.p header{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:'t c' 'b b';align-items:center;height:auto;padding:10px 14px;gap:8px 10px;text-align:left}.p header h1{grid-area:t;font-size:22px;white-space:normal;line-height:1.25}.p .tools{grid-area:b;flex-wrap:wrap;justify-content:center;margin:0}
.p #main{grid-template-columns:1fr;grid-template-rows:auto;grid-template-areas:"inp" "view" "res";flex:none;padding:10px}
.p .stage{height:640px}.p #res{overflow:visible}
.p .ctl{flex-wrap:wrap}.p .ctl input{flex-basis:100%;order:9}
.p footer{height:auto;white-space:normal;padding:8px 14px;font-size:14px}

/* Y / N / ? কার্ড */
.card{display:grid;grid-template-columns:minmax(0,1fr) 34px;grid-template-rows:auto 34px 24px;padding:0;overflow:hidden;border-radius:6px;gap:0;background:#fff;box-shadow:0 1px 3px #06305f18}
.card .top{grid-column:1/3;text-align:center;font-size:13px;padding:1px 4px;border-bottom:1.5px solid var(--line);background:#f3f8fe;line-height:1.35}
.card input{grid-column:1;grid-row:2;min-width:0;width:100%;border:0;border-right:1.5px solid var(--line);padding:0 8px;font:inherit;font-size:20px;font-weight:600;color:var(--blue);outline:0;background:transparent}
.card.c input{color:var(--ok)}.card input.bad{background:#fde8e8}.card input:disabled{color:var(--mut)}
.card .un{grid-column:1;grid-row:3;position:relative;border-top:1.5px solid var(--line);border-right:1.5px solid var(--line);background:#eef5fd}
.card .un select{appearance:none;-webkit-appearance:none;width:100%;height:100%;border:0;background:transparent;font:inherit;font-size:14px;color:var(--ink);padding:0 22px 0 8px;cursor:pointer}
.card .un i{position:absolute;right:7px;top:50%;transform:translateY(-50%);font-style:normal;font-size:13px;pointer-events:none;color:var(--mut)}
.yn{grid-column:2;grid-row:2/4;display:flex;flex-direction:column}
.yn button{flex:1;border:0;border-bottom:1.5px solid var(--line);background:#fff;font:inherit;font-size:15px;font-weight:600;color:var(--mut);cursor:pointer;padding:0}
.yn button:last-child{border-bottom:0}.yn button.on{background:var(--navy);color:#fff}.yn button:disabled{opacity:.3;cursor:default}
.p #top{grid-template-columns:1fr 1fr}

/* ৩-৩-৪ বিন্যাস */
#top,.p #top{grid-template-columns:repeat(12,minmax(0,1fr));gap:4px}
#top .card:nth-child(-n+6){grid-column:span 4}
#top .card:nth-child(n+7){grid-column:span 3}
.card{grid-template-columns:minmax(0,1fr) 28px;grid-template-rows:auto 36px 27px}
.card .top{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card input{font-size:18px;padding:0 5px}
.card .un select{font-size:12px;padding:0 16px 0 5px}
.card .un i{right:4px;font-size:11px}
.yn button{font-size:13px;line-height:1;min-height:0;overflow:hidden}

/* উত্তর যাচাই */
.card.no{border-color:#c0392b;background:#fde8e8}.card.no input{color:#c0392b}
.ans{width:100%;border:1.5px solid var(--line);border-radius:6px;font:inherit;font-size:16px;font-weight:600;text-align:right;padding:1px 6px;color:var(--blue);background:#fff;outline:0}
.ans.ok{border-color:var(--ok);background:var(--okbg);color:var(--ok)}.ans.no{border-color:#c0392b;background:#fde8e8;color:#c0392b}
#clap{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:5;background:#06305f99;color:#fff;text-align:center;cursor:pointer}
#clap.on{display:flex}
#clap .em{font-size:150px;line-height:1.1;animation:clp .45s ease-in-out infinite alternate}
#clap .tx{font-size:52px;font-weight:700;margin-top:8px}#clap .sb{font-size:32px;opacity:.95}
@keyframes clp{from{transform:scale(.85) rotate(-12deg)}to{transform:scale(1.15) rotate(12deg)}}

.card .top{padding:1px 4px}
.eye{position:absolute;right:1px;top:50%;transform:translateY(-50%);border:0;background:transparent;font-size:12px;line-height:1;padding:1px 2px;cursor:pointer;opacity:.75}
.eyeb{border:0;background:transparent;cursor:pointer;font-size:13px;padding:0;opacity:.75}
.yn button:nth-child(3){font-size:12px}.yn button:nth-child(3):not(.on){opacity:.55}
.card.x{opacity:1;background:#fff;border:1.5px solid var(--line)}.card.x input{color:var(--mut);background:#fff}.card.x .un{background:#eef5fd}

.tools{margin-left:auto}
.credit{margin-left:22px;text-align:right;font-size:12px;line-height:1.3;opacity:.95;white-space:nowrap}
.credit b{display:block;font-size:19px;font-weight:700;line-height:1.25;opacity:1}
.p .credit{grid-area:c;margin:0;text-align:right;font-size:11px}.p .credit b{font-size:15px}

/* প্রজেক্টর/বড় পর্দার জন্য বড় ইনপুট বক্স (শুধু ডেস্কটপ বিন্যাসে) */
#stage:not(.p) #main{grid-template-columns:800px minmax(0,1fr);gap:12px 16px}
#stage:not(.p) #top{gap:7px}
#stage:not(.p) .card{grid-template-columns:minmax(0,1fr) 46px;grid-template-rows:auto 58px 40px;border-width:2px;border-radius:9px}
#stage:not(.p) .card .top{font-size:19px;font-weight:700;padding:3px 6px}
#stage:not(.p) .card input{font-size:34px;padding:0 10px}
#stage:not(.p) .card .un select{font-size:20px;padding:0 26px 0 10px}
#stage:not(.p) .card .un i{font-size:16px;right:8px}
#stage:not(.p) .yn button{font-size:21px;font-weight:700}
#stage:not(.p) .yn button:nth-child(3){font-size:18px}
#stage:not(.p) #show{height:52px;font-size:24px}
#stage:not(.p) #solve{height:52px;font-size:21px}
#stage:not(.p) #bt{gap:10px;margin-top:8px}
#stage:not(.p) #msg{font-size:20px}
#stage:not(.p) .panel h2{font-size:26px}
#stage:not(.p) td,#stage:not(.p) th{font-size:22px;padding:5px 4px}
#stage:not(.p) .ans{font-size:22px}
#stage:not(.p) td:nth-child(3){width:80px}
#stage:not(.p) .eyeb{font-size:20px}
#stage:not(.p) .tools button{font-size:20px;padding:7px 16px}
#stage:not(.p) #vbar button,#stage:not(.p) .ctl button{font-size:20px;padding:8px 16px}
#stage:not(.p) #hud,#stage:not(.p) .ctl span{font-size:20px}

/* উপরে ইনপুট, নিচে সিমুলেশন (ডেস্কটপ/প্রজেক্টর বিন্যাস) */
#stage:not(.p) #main{grid-template-columns:minmax(0,1fr) 520px;grid-template-rows:auto minmax(0,1fr);grid-template-areas:"inp inp" "view res";gap:12px 14px;padding:10px 16px}
#stage:not(.p) #inp{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:6px 14px;align-items:start}
#stage:not(.p) #top{grid-column:1;grid-template-columns:repeat(10,minmax(0,1fr));gap:7px}
#stage:not(.p) #top .card{grid-column:span 2!important}
#stage:not(.p) #bt{grid-column:2;flex-direction:column;margin-top:0;gap:8px}
#stage:not(.p) #show{height:66px;font-size:26px}
#stage:not(.p) #solve{height:66px;font-size:23px}
#stage:not(.p) #msg{grid-column:1/3;margin-top:0}
#stage:not(.p) .card{grid-template-rows:auto 54px 38px}
#stage:not(.p) .card input{font-size:32px}

/* উপরে সিমুলেশন (অর্ধেক), নিচে মান দেওয়া (অর্ধেক) */
#stage:not(.p) #main{grid-template-columns:minmax(0,1fr) 520px;grid-template-rows:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"view view" "inp res";gap:10px 14px;padding:10px 16px}
#stage:not(.p) #inp{overflow-y:auto;min-height:0}
#stage:not(.p) #msg{font-size:18px}

/* নিচের অর্ধেক: ১০টি বড় বক্স, তার নিচে চালাও বাটন ও অতিরিক্ত মান */
#bot{display:contents}
#stage:not(.p) #main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"view" "bot";gap:10px;padding:10px 16px}
#stage:not(.p) #bot{grid-area:bot;display:flex;flex-direction:column;gap:8px;overflow-y:auto;min-height:0;padding-right:2px}
#stage:not(.p) #inp{display:block;overflow:visible;flex:none}
#stage:not(.p) #res{grid-area:auto;overflow:visible;flex:none;display:flex;flex-direction:column;gap:8px;padding:0}
#stage:not(.p) #top{grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
#stage:not(.p) #top .card{grid-column:auto!important}
#stage:not(.p) .card{grid-template-columns:minmax(0,1fr) 64px;grid-template-rows:auto 66px 44px;border-width:2px}
#stage:not(.p) .card .top{font-size:23px;padding:3px 8px}
#stage:not(.p) .card input{font-size:42px;padding:0 14px}
#stage:not(.p) .card .un select{font-size:23px;padding:0 30px 0 12px}
#stage:not(.p) .card .un i{font-size:18px;right:10px}
#stage:not(.p) .yn button{font-size:25px}
#stage:not(.p) .yn button:nth-child(3){font-size:22px}
#stage:not(.p) #bt{display:block;margin-top:8px}
#stage:not(.p) #show{display:block;width:100%;height:68px;font-size:30px}
#stage:not(.p) #msg{font-size:20px;margin-top:6px}

/* উত্তর প্রদর্শন প্যানেল (সিমুলেশনের পাশে) */
#vrow{flex:1;min-height:0;display:flex}
#vrow #view{flex:1;min-width:0}
#side{display:none;flex:none;width:520px;position:relative;overflow:hidden;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;padding:12px 16px;background:linear-gradient(160deg,#06305f 0%,#0a63d6 100%);border-left:3px solid #ffd23f}
#side.on{display:flex}
#side .sx{position:absolute;right:8px;top:6px;z-index:3;border:0;background:#ffffff33;color:#fff;border-radius:8px;font:inherit;font-size:20px;width:36px;height:36px;cursor:pointer}
#side .em{font-size:64px;line-height:1.1;position:relative;z-index:2}
#side.cele .em{animation:clp .45s ease-in-out infinite alternate}
#side .nm{font-size:30px;font-weight:700;line-height:1.3;position:relative;z-index:2}
#side .vl{font-weight:700;line-height:1.05;color:#ffe680;margin:2px 0;position:relative;z-index:2;word-break:break-word;text-shadow:0 3px 10px #0006}
#side .un{font-size:44px;font-weight:600;position:relative;z-index:2}
#side .ok{font-size:30px;font-weight:700;margin-top:8px;position:relative;z-index:2;background:#ffffff26;border-radius:12px;padding:4px 16px}
#side .cf{position:absolute;top:-24px;width:10px;height:16px;border-radius:2px;opacity:.95;pointer-events:none;z-index:1;animation:cfall linear forwards}
@keyframes cfall{to{transform:translateY(620px) rotate(900deg)}}
.p #vrow{flex-direction:column}
.p #side{width:auto;flex:none;border-left:0;border-top:3px solid #ffd23f;padding:12px 10px 14px}
.p #side .em{font-size:48px}.p #side .nm{font-size:22px}.p #side .un{font-size:30px}.p #side .ok{font-size:22px}
</style></head><body><div id="wrap"><div id="stage">
<header><h1>প্রাসের গতি — ইন্টারঅ্যাকটিভ সিমুলেশন</h1><div class="tools"><button id="fs">⛶ পূর্ণ পর্দা</button><button id="dm">🖥 ডেস্কটপ মোড</button><button id="rst">↺ নতুন সমস্যা</button></div><div class="credit"><b>মোঃ আমিরুল ইসলাম</b>প্রভাষক (পদার্থবিজ্ঞান)<br>হাজী জসীম উদ্দীন ডিগ্রী কলেজ<br>দুবলিয়া, পাবনা সদর, পাবনা।</div></header>
<div id="main">
<div class="stage"><div id="vrow"><div id="view"><div id="vbar"><button id="b3" class="on">3D দৃশ্যপট</button><button id="bs">পাশের দৃশ্য</button><button id="bc">ক্যামেরা রিসেট</button><button id="bsd" class="on">👏 হাততালি</button><button id="bh">⏱ সময় দেখাও</button></div><div id="hud"></div><div id="ph"></div></div><div id="side"></div></div>
<div class="ctl"><button id="play">▶ চালাও</button><button id="pause">⏸ বিরতি</button><button id="restart">↺ শুরু থেকে</button><button id="slow">⏪ ধীরে</button><button id="fast">⏩ দ্রুত</button><span id="spd">গতি: 1×</span><input type="range" id="tl" min="0" max="1000" value="0" aria-label="সময়"></div></div>
<div id="bot"><section id="inp"><div id="top"></div><div id="bt"><button class="btn" id="show">▶ সিমুলেশন চালাও</button></div><div id="msg"></div></section><section id="res"><div class="panel fold shut"><h2 id="rth" role="button" tabindex="0">অতিরিক্ত মান</h2><table id="rt"></table></div><div class="panel" id="qp" style="display:none"><h2>নির্দিষ্ট বিন্দুর মান</h2><table id="qt"></table></div><div class="panel"><h2>পথের কিছু মান (x, y)</h2><table id="pt"></table></div></section></div>
</div>

<script>

function calc(v,a,g,h){const s=Math.sin(rad(a)),c=Math.cos(rad(a)),vx=v*c,vy=v*s,T=(vy+Math.sqrt(vy*vy+2*g*h))/g;return{v,a,g,h,T,H:h+vy*vy/(2*g),R:vx*T,vx,vy}}
function consts(g,h){const k=s=>S[s].m==='k'?S[s].x:undefined,T=k('T'),R=k('R'),H=k('H'),t=k('pt'),x=k('px'),y=k('py'),C=[];
 const vxy=(v,a)=>[v*Math.cos(rad(a)),v*Math.sin(rad(a))],Tf=(v,a)=>{const vy=vxy(v,a)[1];return(vy+Math.sqrt(vy*vy+2*g*h))/g};

// নির্দিষ্ট কোণে একটি শর্ত থেকে v বের করা (v বাড়লে সব রাশি বাড়ে, তাই bisection)
function solveV(c,a){let lo=1e-4,hi=1e8;const flo=c.f(lo,a)-c.y,fhi=c.f(hi,a)-c.y;if(!(flo<0&&fhi>0))return NaN;for(let i=0;i<220;i++){const m=Math.sqrt(lo*hi),fm=c.f(m,a)-c.y;if(fm<0)lo=m;else hi=m;if(hi/lo<1+1e-13)break}return Math.sqrt(lo*hi)}

function rootsA(fn){const V=AG.map(fn),L=[];let valid=0,flat=0;V.forEach(y=>{if(!isNaN(y)){valid++;if(Math.abs(y)<1e-7)flat++}});

 for(let i=0;i<AG.length-1;i++){const y0=V[i],y1=V[i+1];if(isNaN(y0)||isNaN(y1))continue;if(y0===0)L.push(AG[i]);else if(y0*y1<0)L.push(bis(AG[i],AG[i+1],y0))}
 for(let i=1;i<AG.length-1;i++){const y=V[i];if(isNaN(y)||isNaN(V[i-1])||isNaN(V[i+1]))continue;const ay=Math.abs(y);
  if(ay<Math.abs(V[i-1])&&ay<=Math.abs(V[i+1])&&ay<.02&&V[i-1]*y>0&&y*V[i+1]>0){let lo=AG[i-1],hi=AG[i+1];for(let k=0;k<60;k++){const m1=lo+(hi-lo)*.382,m2=lo+(hi-lo)*.618;if(Math.abs(fn(m1))<Math.abs(fn(m2)))hi=m2;else lo=m1}const m=(lo+hi)/2;if(Math.abs(fn(m))<1e-4)L.push(m)}}

const rel=(c,v,a)=>(c.f(v,a)-c.y)/Math.max(Math.abs(c.y),1e-9);
function gen(C){ // null = অপর্যাপ্ত, [] = অসম্ভব

function probe(){const k=s=>S[s].m==='k'?S[s].x:undefined,t=k('pt'),x=k('px'),y=k('py');
 if(t===undefined&&x===undefined&&y===undefined)return{pts:[]};
 let ts=[];if(t!==undefined)ts=[t];else if(x!==undefined)ts=[x/P.vx];else{const d=P.vy*P.vy-2*P.g*(y-P.h);if(d>=0){const s=Math.sqrt(d);ts=[(P.vy-s)/P.g,(P.vy+s)/P.g]}}

function solveGH(){const k=GQ.g?'g':'h';

function say(cls,t){const m=$('msg');m.innerHTML='';if(choices){const d=document.createElement('div');d.className='info';d.innerHTML='<b>একাধিক সমাধান আছে।</b> একটি বেছে নাও:';choices.forEach(([v,a],i)=>{const b=document.createElement('button');b.className='btn';b.textContent=HIDE?'সমাধান '+(i+1):'θ₀ = '+f(a)+'°, v₀ = '+f(v)+' m/s';b.onclick=()=>solve(i);d.appendChild(b)});m.appendChild(d)}else if(t){const d=document.createElement('div');d.className=cls;d.textContent=t;m.appendChild(d)}}
